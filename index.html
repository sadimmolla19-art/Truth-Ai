<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030712">
<title>Satyexa AI • Genesis Prime v20.0 APEX (Python Edition)</title>
<style>
  :root {
    --bg: #030712; --card: rgba(13, 20, 38, 0.96); --border: rgba(56, 189, 248, 0.35);
    --accent: #10b981; --cyan: #06b6d4; --purple: #8b5cf6; --gold: #f59e0b; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: radial-gradient(circle at top right, #0f172a, #030712 75%); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

  header { padding: 12px 16px; background: rgba(6, 10, 22, 0.97); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .logo-area { display: flex; align-items: center; gap: 8px; }
  .menu-btn { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 6px 10px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .logo { font-size: 17.5px; font-weight: 900; letter-spacing: 0.5px; background: linear-gradient(90deg, #10b981, #38bdf8, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .badge { font-size: 9.5px; background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(168,85,247,0.25)); color: #fde68a; padding: 2px 7px; border-radius: 20px; border: 1px solid rgba(245,158,11,0.5); font-weight: 800; }
  .user-info { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .logout-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); padding: 5px 9px; font-size: 11px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  .sidebar { position: fixed; top: 0; left: -285px; width: 275px; height: 100vh; background: #070b16; border-right: 1px solid var(--border); z-index: 1000; transition: 0.3s ease; padding: 16px; display: flex; flex-direction: column; }
  .sidebar.open { left: 0; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 999; }
  .sidebar-overlay.open { display: block; }
  .session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .session-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; background: #0f172a; border: 1px solid #1e293b; border-radius: 9px; font-size: 12.5px; cursor: pointer; color: #cbd5e1; }
  .session-item.active { border-color: var(--accent); background: rgba(16, 185, 129, 0.12); color: white; font-weight: 600; }

  main { flex: 1; max-width: 1020px; width: 100%; margin: auto; padding: 10px; }
  .card { background: var(--card); backdrop-filter: blur(18px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 20px 45px rgba(0,0,0,0.65); }

  input, textarea, select { width: 100%; padding: 11px 13px; margin: 6px 0 12px; background: #060a16; color: white; border: 1px solid #1e293b; border-radius: 11px; font-size: 14.5px; outline: none; transition: 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2); }
  button { background: linear-gradient(135deg, #059669, #0284c7); color: white; border: 0; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-full { width: 100%; } .btn-secondary { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }

  nav { display: flex; gap: 4px; margin-bottom: 10px; background: var(--card); padding: 5px; border-radius: 13px; border: 1px solid var(--border); }
  nav button { flex: 1; background: transparent; color: var(--muted); padding: 8px 4px; font-size: 12px; border-radius: 9px; }
  nav button.active { background: linear-gradient(135deg, #10b981, #2563eb); color: white; }

  .top-status { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .engine-select { flex: 1; min-width: 175px; margin: 0; padding: 6px 8px; font-size: 11.5px; background: #0f172a; border-color: #334155; color: #38bdf8; font-weight: 600; }
  .web-toggle { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 8px; font-size: 11px; border-radius: 8px; }
  .web-toggle.on { background: rgba(6, 182, 212, 0.2); border-color: #06b6d4; color: #38bdf8; }
  .think-toggle.on { background: rgba(168, 85, 247, 0.25); border-color: #a855f7; color: #e9d5ff; }

  .chat-container { display: flex; gap: 10px; }
  #messages, #messagesSplit { flex: 1; height: 50vh; overflow-y: auto; background: #040711; padding: 12px; border-radius: 13px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 12px; }
  .msg-wrap { display: flex; flex-direction: column; max-width: 93%; }
  .msg-wrap.user-wrap { align-self: flex-end; }
  .msg-wrap.ai-wrap { align-self: flex-start; }
  .msg { padding: 11px 14px; border-radius: 14px; line-height: 1.6; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .user { background: linear-gradient(135deg, #059669, #0d9488); color: white; border-bottom-right-radius: 4px; }
  .ai { background: #0f172a; border: 1px solid #1e293b; border-left: 3px solid var(--gold); border-bottom-left-radius: 4px; }
  .engine-tag { font-size: 9.5px; color: #fbbf24; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
  .msg-actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .mini-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 3px 8px; font-size: 10.5px; border-radius: 6px; }
  .run-btn { background: rgba(16,185,129,0.2); color: #34d399; border-color: #10b981; }
  pre { background: #020617; border: 1px solid #334155; padding: 10px; border-radius: 8px; overflow-x: auto; font-family: monospace; font-size: 12.5px; color: #38bdf8; margin: 6px 0; }

  .sandbox-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; flex-direction: column; padding: 16px; }
  .sandbox-header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 12px 12px 0 0; border: 1px solid #334155; }
  .sandbox-frame { flex: 1; background: white; border: none; border-radius: 0 0 12px 12px; width: 100%; }

  .input-wrapper { margin-top: 10px; background: #060a16; border: 1px solid #334155; border-radius: 13px; padding: 8px; }
  .input-wrapper textarea { margin: 0; border: none; background: transparent; padding: 4px 6px; height: 48px; resize: none; font-size: 14.5px; }
  .input-bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1e293b; }
  .left-tools { display: flex; gap: 6px; }
  .icon-btn { background: #1e293b; border: 1px solid #334155; padding: 6px 11px; font-size: 15px; border-radius: 8px; }
  .icon-btn.recording { background: #dc2626; border-color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  .send-btn { padding: 7px 18px; background: linear-gradient(135deg, #10b981, #3b82f6); border-radius: 9px; font-size: 13.5px; }

  #previewBox { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: #0f172a; padding: 7px 12px; border-radius: 10px; border: 1px solid #334155; }
  #previewBox img { height: 40px; width: 40px; object-fit: cover; border-radius: 6px; }
  #imageResult img { width: 100%; max-height: 420px; object-fit: contain; border-radius: 13px; margin-top: 12px; border: 1px solid var(--border); }

  .key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .key-box { background: #080d1d; padding: 10px; border-radius: 10px; border: 1px solid #1e293b; }
  .key-box label { font-size: 11px; color: #38bdf8; font-weight: 700; display: block; }
  .key-box input { margin: 5px 0 0; padding: 8px 10px; font-size: 12px; }

  .auth-msg { font-size: 12px; padding: 8px; border-radius: 8px; margin-bottom: 10px; display: none; }
  .auth-msg.err { display: block; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
  .auth-msg.ok { display: block; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }

  .panel { display: none; } .panel.active { display: block; } .hidden { display: none !important; }
  .small { font-size: 12px; color: var(--muted); } .toggle-link { color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: underline; }
  footer { text-align: center; color: #64748b; padding: 12px; font-size: 11.5px; border-top: 1px solid rgba(30,41,59,0.5); margin-top: 16px; }
  footer strong { color: #10b981; }
</style>
</head>
<body>
