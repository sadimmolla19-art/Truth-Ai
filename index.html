<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030712">
<title>Satyexa AI • Genesis Prime v10.0</title>
<style>
  :root {
    --bg: #030712; --card: rgba(13, 20, 38, 0.9); --border: rgba(56, 189, 248, 0.3);
    --accent: #10b981; --cyan: #06b6d4; --purple: #8b5cf6; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: radial-gradient(circle at top right, #0f172a, #030712 75%); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

  header { padding: 13px 18px; background: rgba(6, 10, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .logo-area { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; background: linear-gradient(90deg, #10b981, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .badge { font-size: 10px; background: rgba(16,185,129,0.15); color: #34d399; padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(16,185,129,0.4); font-weight: 700; }
  .user-info { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .logout-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); padding: 5px 10px; font-size: 11.5px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  main { flex: 1; max-width: 900px; width: 100%; margin: auto; padding: 12px; }
  .card { background: var(--card); backdrop-filter: blur(18px); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 0 20px 45px rgba(0,0,0,0.65); }

  input, textarea, select { width: 100%; padding: 11px 14px; margin: 6px 0 12px; background: #060a16; color: white; border: 1px solid #1e293b; border-radius: 11px; font-size: 14.5px; outline: none; transition: 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2); }

  button { background: linear-gradient(135deg, #059669, #0284c7); color: white; border: 0; padding: 11px 18px; border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  button:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-full { width: 100%; } .btn-secondary { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }

  nav { display: flex; gap: 6px; margin-bottom: 12px; background: var(--card); padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
  nav button { flex: 1; background: transparent; color: var(--muted); padding: 9px; font-size: 13.5px; border-radius: 10px; }
  nav button.active { background: linear-gradient(135deg, #10b981, #2563eb); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

  .top-status { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .engine-select { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; background: #0f172a; border-color: #334155; color: #38bdf8; font-weight: 600; }

  #messages { height: 54vh; overflow-y: auto; background: #040711; padding: 14px; border-radius: 14px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 14px; }
  .msg-wrap { display: flex; flex-direction: column; max-width: 88%; }
  .msg-wrap.user-wrap { align-self: flex-end; }
  .msg-wrap.ai-wrap { align-self: flex-start; }
  .msg { padding: 12px 16px; border-radius: 15px; line-height: 1.65; font-size: 14.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .user { background: linear-gradient(135deg, #059669, #0d9488); color: white; border-bottom-right-radius: 4px; }
  .ai { background: #0f172a; border: 1px solid #1e293b; border-left: 3px solid var(--cyan); border-bottom-left-radius: 4px; }
  .engine-tag { font-size: 10px; color: #38bdf8; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .msg-actions { display: flex; gap: 6px; margin-top: 5px; }
  .mini-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 3px 9px; font-size: 11px; border-radius: 6px; }

  .chat-tools { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .icon-btn { background: #1e293b; border: 1px solid #334155; padding: 0 13px; height: 46px; font-size: 17px; display: flex; align-items: center; justify-content: center; }
  .icon-btn.recording { background: #dc2626; border-color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  .chat-tools textarea { margin: 0; resize: none; height: 46px; flex: 1; }
  .send-btn { height: 46px; padding: 0 18px; background: linear-gradient(135deg, #10b981, #3b82f6); }

  #previewBox { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: #0f172a; padding: 7px 12px; border-radius: 10px; border: 1px solid #334155; }
  #previewBox img { height: 42px; width: 42px; object-fit: cover; border-radius: 6px; }
  #imageResult img { width: 100%; max-height: 440px; object-fit: contain; border-radius: 14px; margin-top: 14px; border: 1px solid var(--border); }

  .key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .key-box { background: #080d1d; padding: 10px; border-radius: 10px; border: 1px solid #1e293b; }
  .key-box label { font-size: 11.5px; color: #38bdf8; font-weight: 700; display: block; }
  .key-box input { margin: 5px 0 0; padding: 8px 10px; font-size: 12.5px; }

  .panel { display: none; } .panel.active { display: block; } .hidden { display: none !important; }
  .small { font-size: 12.5px; color: var(--muted); } .toggle-link { color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: underline; }
  footer { text-align: center; color: #64748b; padding: 14px; font-size: 12px; border-top: 1px solid rgba(30,41,59,0.5); margin-top: 18px; }
  footer strong { color: #10b981; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo">✦ SATYEXA AI</div>
    <span class="badge">GENESIS v10.0</span>
  </div>
  <div id="userHeader" class="user-info hidden">
    <span id="displayUser">User</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <!-- Login / Signup Section -->
  <section id="authSection" class="card" style="max-width: 420px; margin: 22px auto;">
    <h2 id="authTitle" style="margin-top:0;">🔐 Login to Satyexa AI</h2>
    <p class="small">8-Engine Frontier AI • Powered by <strong>Sadimx Technology</strong></p>
    <label class="small">Username</label>
    <input type="text" id="usernameInput" placeholder="Enter your username">
    <label class="small">Password</label>
    <input type="password" id="passwordInput" placeholder="Enter your password">
    <label class="small" style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
      <input type="checkbox" id="ageConfirm" style="width:auto; margin:0;" checked> I confirm that I am 18 years or older.
    </label>
    <button class="btn-full" onclick="handleAuth()" id="authBtn">Login to Workspace</button>
    <p class="small" style="text-align:center; margin-top:15px;">
      <span id="toggleText">New to Satyexa AI?</span> 
      <span class="toggle-link" onclick="toggleAuthMode()" id="toggleBtn">Create Account</span>
    </p>
  </section>

  <!-- Main Workspace -->
  <section id="appSection" class="hidden">
    <nav>
      <button class="active" onclick="switchTab('chatTab', this)">💬 Smart AI Chat</button>
      <button onclick="switchTab('imageTab', this)">🎨 Image Studio</button>
      <button onclick="switchTab('settingsTab', this)">⚙️ 8-AI Engines</button>
    </nav>

    <!-- Chat Panel -->
    <div id="chatTab" class="panel active card">
      <div class="top-status">
        <select id="activeEngine" class="engine-select" onchange="localStorage.setItem('sx_active_engine', this.value)">
          <option value="auto">⚡ Auto Best Engine (Smart Failover)</option>
          <option value="gemini">1. Google Gemini 3.8 Flash</option>
          <option value="groq">2. Groq (Llama 3.3 70B)</option>
          <option value="cerebras">3. Cerebras (Qwen 3.8 / Llama)</option>
          <option value="openrouter">4. OpenRouter (DeepSeek R1 Free)</option>
          <option value="mistral">5. Mistral AI Latest</option>
          <option value="sambanova">6. SambaNova (GLM-5.3 / Llama)</option>
          <option value="github">7. GitHub Models (GPT-4o)</option>
          <option value="cohere">8. Cohere (Command-A+)</option>
        </select>
        <button class="btn-secondary" style="padding:5px 10px; font-size:11.5px;" onclick="clearChatHistory()">🗑️ Clear Chat</button>
      </div>

      <div id="messages"></div>

      <!-- Image Attachment Preview -->
      <div id="previewBox" class="hidden">
        <img id="attachedPreview" src="" alt="Preview">
        <span class="small" style="flex:1;">Image attached (Gemini Vision Active)</span>
        <button class="mini-btn" onclick="removeImage()">❌ Remove</button>
      </div>

      <!-- Input & Multimodal Controls -->
      <div class="chat-tools">
        <input type="file" id="visionInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <button class="icon-btn" title="Upload Image to Ask" onclick="document.getElementById('visionInput').click()">📷</button>
        <button class="icon-btn" id="micBtn" title="Voice Input (Bangla/English)" onclick="toggleVoice()">🎤</button>
